spring.application.name=auth

server.port=${PORT:9000}

spring.datasource.url=${DB_URL:jdbc:oracle:thin:@//localhost:1521/FREEPDB1}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}

spring.datasource.driver-class-name=oracle.jdbc.OracleDriver

# update conserva las tablas y los datos; para un esquema existente se recomienda validate.
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:create-drop}

# --- Propiedades propias del proyecto (el código las lee con @Value) ---

# JWT de /api/login: quién emite el token y cuánto dura (en segundos)
auth.jwt.issuer=http://localhost:${PORT:9000}
auth.jwt.expiration-seconds=900

# CORS: orígenes permitidos, separados por coma (Angular en desarrollo)
auth.cors.allowed-origins=http://localhost:4200
