server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      server:
        webflux:
          x-forwarded:
            prefix-enabeled: true
          routes:
            - id: ruta-reservas
              uri: lb://reservas
              predicates:
                - Path=/api/reservas/**
              filters:
                - StripPrefix=2

            - id: ruta-habitacion
              uri: lb://habitacion
              predicates:
                - Path=/api/habitacion/**
              filters:
                - StripPrefix=2

            - id: ruta-huespedes
              uri: lb://huespedes
              predicates:
                - Path=/api/huespedes/**
              filters:
                - StripPrefix=2
    loadbalancer:
      enabeled: true
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true   # Registrarse con la IP y no con el nombre de host